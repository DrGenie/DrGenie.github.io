          <li><a class="iconlink" href="https://x.com/mesfin_genie"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg><span>X</span></a></li>
        </ul>
      </div>

format:
  html:
    theme: custom.scss
    toc: false
    page-layout: article
    smooth-scroll: false
    anchor-sections: false
    link-external-newwindow: true
    link-external-icon: false
    include-in-header: _includes/head.html
    include-after-body: _includes/scripts.html
    title-block-banner: false

execute:
  freeze: auto
