website:
  site-url: "https://mesfingenie.com"
  favicon: assets/favicon.png
  page-navigation: true
  back-to-top-navigation: true
  open-graph:
    locale: en_AU
    site-name: "Mesfin Genie"
    image: /assets/og-card.png
  twitter-card:
    card-style: summary_large_image
    creator: "@mesfin_genie"
    image: /assets/og-card.png
  search: true
  navbar:
    pinned: true
    collapse-below: lg
    background: "#002244"
    foreground: "#ffffff"
    title: "Mesfin Genie"
    left:
      - text: "Home"
        href: /
      - text: "Research"
        href: /research/
      - text: "Publications"
        href: /publications/
      - text: "Tools"
        href: /tools/
      - text: "Teaching & Supervision"
        href: /teaching/
      - text: "Writing & Talks"
        href: /writing/
      - text: "About"
        href: /about/
    right:
      - text: "CV"
        href: /cv/
  page-footer:
    left: |
      <div class="wb-footer"><div class="wb-footer-grid">
        <div class="wb-foot-brand">
          <p class="wb-foot-name">Dr Mesfin Genie</p>
