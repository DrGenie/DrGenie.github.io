lang: en-AU

project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - 404.qmd
    - research/index.qmd
    - research/impact/index.qmd
    - research/data-and-code/index.qmd
    - research/projects/health-preferences-dce/index.qmd
    - research/projects/eye-tracking-attribute-ordering/index.qmd
    - research/projects/decision-support-tools/index.qmd
    - research/projects/mandeval/index.qmd
    - research/projects/fetp-india/index.qmd
    - publications/index.qmd
    - tools/index.qmd
    - tools/emandeval/index.qmd
    - tools/steps/index.qmd
    - tools/soil-crc-bca/index.qmd
    - about/index.qmd
    - teaching/index.qmd
    - supervision/index.qmd
    - grants/index.qmd
    - writing/index.qmd
    - cv/index.qmd
    - blog/index.qmd
    - blog/posts/*/index.qmd
  resources:
    - CNAME
    - .nojekyll
    - robots.txt
    - assets/**
    - eMANDEVA-DecisionAid-V18/**
    - farming-bca-tool-v18/**
    - STEPS-FETP-DecisionAid-V20/**
    #
    # cv/mesfin-genie-cv.pdf does not need a line here: Quarto copies local
    # files that a page links to.

website:
  title: "Mesfin Genie"
  site-url: "https://mesfingenie.com"
  favicon: assets/favicon.png
  page-navigation: false
  back-to-top-navigation: false
  search: false
  open-graph:
    locale: en_AU
  twitter-card:
    card-style: summary_large_image
    creator: "@mesfin_genie"

  navbar:
    pinned: false
    collapse-below: lg
    background: "#fbfbf9"
    foreground: "#16232b"
    title: "Mesfin Genie"
    left:
      - text: "Research"
        href: /research/
      - text: "Papers"
        href: /publications/
      - text: "Tools"
        href: /tools/
      - text: "About"
        href: /about/
    right:
      - text: "CV"
        href: /cv/

  page-footer:
    left: |
      <div class="foot">
        <p>Mesfin Genie, Newcastle Business School, University of Newcastle, Australia</p>
        <p><a href="mailto:mesfin.genie@newcastle.edu.au">mesfin.genie@newcastle.edu.au</a><span class="foot-sep">|</span><a href="https://scholar.google.com/citations?user=v2SXM_kAAAAJ">Google&nbsp;Scholar</a><span class="foot-sep">|</span><a href="https://orcid.org/0000-0002-1744-4666">ORCID</a><span class="foot-sep">|</span><a href="https://github.com/DrGenie">GitHub</a></p>
      </div>

format:
  html:
    theme: custom.scss
    toc: false
    page-layout: article
    smooth-scroll: false
    anchor-sections: false
    link-external-newwindow: true
    link-external-icon: false
    include-in-header: _includes/head.html
    include-after-body: _includes/scripts.html
    title-block-banner: false

execute:
  freeze: auto
