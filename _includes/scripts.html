<script>
/* ---------------------------------------------------------------------------
   Choice task (homepage)

   Three binary choices between a shorter wait at a cost and a longer wait at
   no cost. The cost is bisected on the respondent's own answers, so the three
   choices bracket the amount at which they switch. This is the elicitation
   logic behind a double-bounded dichotomous choice question; a discrete
   choice experiment does the same thing across many respondents and many
   attributes, and estimates the switching point rather than bracketing it.

   The wait difference is held at four weeks throughout, so every bound is a
   willingness to pay for the same four weeks.
--------------------------------------------------------------------------- */
(function () {
  var root = document.getElementById("choice-task");
  if (!root) return;

  var WEEKS = 4;           // 6 weeks minus 2 weeks
  var SCALE_MAX = 300;     // right edge of the interval figure, in dollars

  // Bid tree. Key is the answers given so far; value is the cost shown.
  var BIDS = {
    "":    80,
    "A":   160,
    "B":   40,
    "AA":  240,
    "AB":  120,
    "BA":  60,
    "BB":  20
  };

  // Interval implied by all three answers, in dollars. null = open ended.
  var BOUNDS = {
    "AAA": [240, null],
    "AAB": [160, 240],
    "ABA": [120, 160],
    "ABB": [80, 120],
    "BAA": [60, 80],
    "BAB": [40, 60],
    "BBA": [20, 40],
    "BBB": [0, 20]
  };

  var ask     = document.getElementById("ct-ask");
  var out     = document.getElementById("ct-out");
  var bidCell = document.getElementById("ct-bid");
  var counter = document.getElementById("ct-n");
  var answer  = document.getElementById("ct-answer");
  var band    = document.getElementById("ct-band");
  var restart = document.getElementById("ct-restart");
  var dots    = root.querySelectorAll(".ct-dot");

  var path = "";

  function money(n) {
    return "$" + n.toFixed(0);
  }

  function rate(n) {
    var v = n / WEEKS;
    return v >= 10 ? "$" + v.toFixed(0) : "$" + v.toFixed(2).replace(/\.00$/, "");
  }

  function render() {
    bidCell.textContent = money(BIDS[path]);
    counter.textContent = String(path.length + 1);
    for (var i = 0; i < dots.length; i++) {
      dots[i].classList.toggle("on", i < path.length);
    }
  }

  function finish() {
    var b = BOUNDS[path];
    var lo = b[0];
    var hi = b[1];

    var sentence;
    if (hi === null) {
      sentence = "Your answers put your willingness to pay above " + money(lo) +
        " to avoid four extra weeks of waiting, which is more than " + rate(lo) + " a week.";
    } else if (lo === 0) {
      sentence = "Your answers put your willingness to pay below " + money(hi) +
        " to avoid four extra weeks of waiting, which is under " + rate(hi) + " a week.";
    } else {
      sentence = "Your answers put your willingness to pay between " + money(lo) +
        " and " + money(hi) + " to avoid four extra weeks of waiting, which is " +
        rate(lo) + " to " + rate(hi) + " a week.";
    }
    answer.textContent = sentence;

    var right = hi === null ? SCALE_MAX : Math.min(hi, SCALE_MAX);
    var left = Math.min(lo, SCALE_MAX);
    band.style.left = (left / SCALE_MAX * 100) + "%";
    band.style.width = Math.max((right - left) / SCALE_MAX * 100, 1.5) + "%";

    ask.style.display = "none";
    out.classList.add("show");
    out.focus();
  }

  root.addEventListener("click", function (e) {
    var btn = e.target.closest(".ct-pick");
    if (btn) {
      path += btn.getAttribute("data-pick");
      if (path.length === 3) { finish(); } else { render(); }
      return;
    }
    if (e.target === restart) {
      path = "";
      out.classList.remove("show");
      ask.style.display = "";
      render();
      var first = root.querySelector(".ct-pick");
      if (first) first.focus();
    }
  });

  render();
})();


/* ---------------------------------------------------------------------------
   Papers filter

   Filters the static list already in the page, so the full list is present
   for search engines and for anyone without JavaScript.
--------------------------------------------------------------------------- */
(function () {
  var bar = document.getElementById("paper-filter");
  if (!bar) return;

  var items = Array.prototype.slice.call(document.querySelectorAll("[data-topic]"));
  var buttons = Array.prototype.slice.call(bar.querySelectorAll("button"));

  // The bar is hidden in CSS and revealed here, so a reader without
  // JavaScript sees the complete list and no controls that do nothing.
  bar.style.display = "flex";

  var count = document.createElement("p");
  count.className = "note";
  count.id = "paper-count";
  count.style.marginTop = "0.7rem";
  bar.parentNode.insertBefore(count, bar.nextSibling);

  var apply;
  function _unused(topic) {
    var shown = 0;
    items.forEach(function (el) {
      var match = topic === "all" || el.getAttribute("data-topic").indexOf(topic) !== -1;
      el.style.display = match ? "" : "none";
      if (match) shown++;
    });
    buttons.forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-filter") === topic));
    });
    count.textContent = shown + (shown === 1 ? " paper" : " papers") + " shown";
  }

  var search = document.getElementById("papers-search");
  var topic = "all", term = "";

  function run() {
    var shown = 0;
    items.forEach(function (el) {
      var okTopic = topic === "all" || el.getAttribute("data-topic").indexOf(topic) !== -1;
      var okTerm = term === "" || el.textContent.toLowerCase().indexOf(term) !== -1;
      var vis = okTopic && okTerm;
      el.style.display = vis ? "" : "none";
      if (vis) shown++;
    });
    buttons.forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-filter") === topic));
    });
    count.textContent = shown + (shown === 1 ? " paper" : " papers");
  }
  apply = function (t) { topic = t; run(); };

  if (search) {
    search.style.display = "block";
    search.addEventListener("input", function () {
      term = search.value.trim().toLowerCase();
      run();
    });
  }

  bar.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (b) apply(b.getAttribute("data-filter"));
  });

  apply("all");
})();

/* ---------------------------------------------------------------------------
   Share row

   Any element with data-share gets a share row built into it. Links are
   assembled from the live URL and the page title, so nothing is hard-coded per
   page. The copy button uses the async clipboard API with a select-and-copy
   fallback for older browsers and for pages served without a secure context.
--------------------------------------------------------------------------- */
(function () {
  var host = document.querySelector("[data-share]");
  if (!host) return;

  var url = location.href.split("#")[0];
  var title = (document.title || "").replace(/\s+–\s+Mesfin Genie$/, "");
  var eu = encodeURIComponent(url);
  var et = encodeURIComponent(title);

  var ICON = {
    linkedin: '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="2"/><path d="M5 7v4M5 5.2v.1M8 11V8.6a1.4 1.4 0 0 1 2.8 0V11"/></svg>',
    x:        '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>',
    bluesky:  '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.2 10.5A2.2 2.2 0 1 1 4.6 6 3.4 3.4 0 0 1 8 3.4 3.4 3.4 0 0 1 11.4 6a2.2 2.2 0 1 1 .4 4.5z"/></svg>',
    mail:     '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3.5" width="12" height="9" rx="1"/><path d="M2.4 4.4L8 9l5.6-4.6"/></svg>',
    link:     '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.6 9.4a2.6 2.6 0 0 0 3.7 0l2-2a2.6 2.6 0 0 0-3.7-3.7l-.8.8"/><path d="M9.4 6.6a2.6 2.6 0 0 0-3.7 0l-2 2a2.6 2.6 0 0 0 3.7 3.7l.8-.8"/></svg>'
  };

  ICON.instagram = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="2.5" width="11" height="11" rx="3.2"/><circle cx="8" cy="8" r="2.8"/><circle cx="11.4" cy="4.6" r="0.5" fill="currentColor"/></svg>';
  ICON.download = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v7.5M5 7.2L8 10.2l3-3M3 12.5h10"/></svg>';

  var targets = [
    ["linkedin", "LinkedIn", "https://www.linkedin.com/sharing/share-offsite/?url=" + eu],
    ["x",        "X",        "https://x.com/intent/tweet?url=" + eu + "&text=" + et],
    ["bluesky",  "Bluesky",  "https://bsky.app/intent/compose?text=" + et + "%20" + eu],
    ["mail",     "Email",    "mailto:?subject=" + et + "&body=" + eu]
  ];

  var html = '<p class="share-label">Share this page</p><ul class="share-row">';
  targets.forEach(function (t) {
    html += '<li><a class="share-btn" href="' + t[2] + '" rel="noopener noreferrer" target="_blank">' +
            ICON[t[0]] + '<span>' + t[1] + '</span></a></li>';
  });
  html += '<li><button type="button" class="share-btn" id="share-ig">' + ICON.instagram +
          '<span>Instagram</span></button></li>';
  html += '<li><button type="button" class="share-btn" id="share-copy">' + ICON.link +
          '<span>Copy link</span></button></li></ul>';
  html += '<img class="ig-preview" id="ig-preview" alt="Square card generated for this post">';
  host.innerHTML = html;

  /* ---- Instagram -------------------------------------------------------
     Instagram has no web share URL. What works: draw a finished square card,
     then hand it to the phone's native share sheet as a file. On iOS and
     Android that sheet lists Instagram, with "Add to your story" one tap away.
     On a desktop there is no sheet, so the card downloads and instagram.com
     opens for the reader to upload it. */
  var meta = function (n) { var m = document.querySelector('meta[name="' + n + '"]'); return m ? m.getAttribute("content") : ""; };
  var desc = meta("description") || "";
  var cats = (document.querySelector('.quarto-categories') ? document.querySelector('.quarto-categories').textContent : "").toLowerCase();
  var field = /behavio|everyday|decision/.test(cats) ? "Behavioural Economics" : "Health Economics";

  function wrapLines(g, text, maxW) {
    var words = text.split(/\s+/), lines = [], line = "";
    for (var i = 0; i < words.length; i++) {
      var t = line ? line + " " + words[i] : words[i];
      if (g.measureText(t).width > maxW && line) { lines.push(line); line = words[i]; } else { line = t; }
    }
    if (line) lines.push(line);
    return lines;
  }

  function drawCard() {
    var S = 1080, c = document.createElement("canvas"); c.width = c.height = S;
    var g = c.getContext("2d");
    var font = '"Inter", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
    var accent = field === "Health Economics" ? "#9a1f35" : "#1f4e9a";

    g.fillStyle = "#ffffff"; g.fillRect(0, 0, S, S);
    g.fillStyle = accent; g.fillRect(0, 0, S, 16);

    // Category label
    g.fillStyle = accent; g.font = "600 30px " + font;
    g.fillText(field.toUpperCase(), 84, 118);

    // Title, sized to fit
    var size = 74, lines;
    do { g.font = "700 " + size + "px " + font; lines = wrapLines(g, title, S - 168); size -= 4; }
    while (lines.length * (size + 4) * 1.18 > 330 && size > 40);
    size += 4;
    g.fillStyle = "#0a0c0f";
    var y = 214;
    lines.forEach(function (l) { g.fillText(l, 84, y); y += size * 1.18; });

    // The hook: the post's own one-line description
    y += 24;
    g.fillStyle = "#3a4149"; g.font = "400 34px " + font;
    wrapLines(g, desc, S - 168).slice(0, 5).forEach(function (l) { g.fillText(l, 84, y); y += 46; });

    // Visual motif: an abstract preference curve, different for every post
    var seed = 0; for (var i = 0; i < title.length; i++) seed = (seed * 31 + title.charCodeAt(i)) >>> 0;
    var bx = 84, bw = S - 168, by = y + 60, bh = Math.max(110, S * 0.815 - by);
    g.strokeStyle = "#e3e5e8"; g.lineWidth = 2;
    g.beginPath(); g.moveTo(bx, by + bh); g.lineTo(bx + bw, by + bh); g.stroke();
    g.beginPath(); g.moveTo(bx, by); g.lineTo(bx, by + bh); g.stroke();
    g.strokeStyle = accent; g.lineWidth = 6; g.lineJoin = "round"; g.beginPath();
    for (var k = 0; k <= 40; k++) {
      var t = k / 40, r = ((seed >> (k % 24)) & 7) / 7;
      var yy = by + bh - bh * (1 - Math.exp(-(2.2 + r) * t)) * 0.92;
      if (k === 0) g.moveTo(bx, yy); else g.lineTo(bx + bw * t, yy);
    }
    g.stroke();
    g.fillStyle = accent;
    g.beginPath(); g.arc(bx + bw, by + bh - bh * 0.92 * (1 - Math.exp(-2.6)), 11, 0, Math.PI * 2); g.fill();

    // Signature
    g.fillStyle = "#0a0c0f"; g.font = "700 38px " + font; g.fillText("Dr Genie", 84, S - 118);
    g.fillStyle = "#6a7178"; g.font = "400 28px " + font;
    g.fillText(field + "  \u00b7  mesfingenie.com", 84, S - 76);
    return c;
  }

  var ig = document.getElementById("share-ig");
  ig.addEventListener("click", function () {
    var c = drawCard();
    var dataUrl = c.toDataURL("image/png");
    var prev = document.getElementById("ig-preview");
    prev.src = dataUrl; prev.classList.add("show");

    var name = (location.pathname.replace(/\/$/, "").split("/").pop() || "card") + "-instagram.png";

    function download() {
      var a = document.createElement("a"); a.href = dataUrl; a.download = name;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      window.open("https://www.instagram.com/", "_blank", "noopener");
    }

    if (c.toBlob && navigator.canShare) {
      c.toBlob(function (blob) {
        var file = new File([blob], name, { type: "image/png" });
        if (navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file], title: title, text: title + " " + url }).catch(function () {});
        } else { download(); }
      }, "image/png");
    } else { download(); }
  });

  var copy = document.getElementById("share-copy");
  copy.addEventListener("click", function () {
    function done() {
      var label = copy.querySelector("span");
      var was = label.textContent;
      label.textContent = "Copied";
      copy.classList.add("is-copied");
      setTimeout(function () {
        label.textContent = was;
        copy.classList.remove("is-copied");
      }, 1800);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(url).then(done, fallback);
    } else {
      fallback();
    }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = url;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); done(); } catch (e) { /* nothing to do */ }
      document.body.removeChild(ta);
    }
  });
})();

</script>
