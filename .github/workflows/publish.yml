name: Publish website
on:
  push:
    branches:
      - main
  workflow_dispatch:

# GitHub's own Pages template grants these at workflow level. The build job
# needs Pages access because actions/configure-pages queries the Pages API.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.9.38"

      - name: Clean previous build
        run: rm -rf _site .quarto

      - name: Render website
        run: quarto render

      - name: Verify rendered website
        shell: bash
        run: |
          fail=0
          for f in index.html publications/index.html tools/index.html about/index.html; do
            if [ ! -f "_site/$f" ]; then
              echo "::error::_site/$f was not created."
              fail=1
            fi
          done
          papers=$(grep -c 'class="rec-title"' _site/publications/index.html || true)
          if [ "$papers" -lt 40 ]; then
            echo "::error::Papers page rendered only $papers entries; expected at least 40."
            fail=1
          fi
          if grep -q '<pre' _site/publications/index.html; then
            echo "::error::Raw markup leaked into a code block on the papers page."
            fail=1
          fi
          for t in eMANDEVA-DecisionAid-V18 farming-bca-tool-v18 STEPS-FETP-DecisionAid-V20; do
            if [ ! -f "_site/$t/index.html" ]; then
              echo "::warning::Tool $t has no index.html; its link will 404."
            fi
          done
          echo "Papers rendered: $papers"
          echo "Pages: $(find _site -name '*.html' | wc -l)"
          du -sh _site
          exit $fail

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy website
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
