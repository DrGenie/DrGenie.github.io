name: Update Google Scholar metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

# contents: write to commit the numbers; actions: write to start the site
# build afterwards, since a commit made with GITHUB_TOKEN does not trigger
# other workflows on its own.
permissions:
  contents: write
  actions: write

concurrency:
  group: scholar-metrics
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Attempt verified metrics update
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scripts/update_scholar_metrics.py

      - name: Commit verified changes
        id: commit
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- assets/scholar-metrics.json about/index.qmd)" ]]; then
            echo "No verified metrics change."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/scholar-metrics.json about/index.qmd

          if git diff --cached --quiet; then
            echo "No verified metrics change to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Update verified Google Scholar metrics"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild and deploy the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main
